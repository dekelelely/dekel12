[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shealth"
version = "0.1.0"
description = "Query your Samsung Health data export from the terminal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
shealth = "shealth.cli:main"

[tool.setuptools]
packages = ["shealth"]

[tool.setuptools.package-data]
shealth = ["web/*.html"]
