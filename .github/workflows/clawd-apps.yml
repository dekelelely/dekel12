name: Clawd apps

# Builds the Windows app (installer + portable .exe) and the Android app (.apk) from clawd-3d/.
# Download them from the run's "Artifacts" section. No secrets or paid services are used.
on:
  push:
    paths:
      - "clawd-3d/**"
      - ".github/workflows/clawd-apps.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the web files into the app
        working-directory: clawd-3d/apps
        run: |
          npm install --no-audit --no-fund
          npm run prepare-web
      - name: Build Clawd for Windows
        working-directory: clawd-3d/apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-Windows
          path: clawd-3d/apps/desktop/dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the web files into the app
        working-directory: clawd-3d/apps
        run: |
          npm install --no-audit --no-fund
          npm run prepare-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Clawd for Android
        working-directory: clawd-3d/apps/android
        run: gradle assembleDebug --no-daemon
      - name: Name the APK
        run: cp clawd-3d/apps/android/app/build/outputs/apk/debug/app-debug.apk Clawd.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-Android
          path: Clawd.apk
          if-no-files-found: error
