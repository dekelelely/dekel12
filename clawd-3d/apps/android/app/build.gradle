plugins {
    id "com.android.application"
}

android {
    namespace "com.dekelelely.clawd"
    compileSdk 34

    defaultConfig {
        applicationId "com.dekelelely.clawd"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    // One fixed debug key for every build (CI included), so a new APK installs over the previous one.
    // It is an ordinary debug key, not a secret: these builds are for sideloading, not the Play Store.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
